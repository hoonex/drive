name: Android Build

on:
  push:
    branches:
      - main
      - ulw/drive-1.2-production-upgrade
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/android-build.yml"
      - ".github/workflows/android-release.yml"
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/android-build.yml"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install stable Android SDK 36
        shell: bash
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Unit tests, lint and debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Prepare validation artifact
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PCWheel-android-validation.apk
          sha256sum dist/PCWheel-android-validation.apk | tee dist/SHA256SUMS.txt
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT.txt

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCWheel-android-validation
          if-no-files-found: error
          path: |
            dist/PCWheel-android-validation.apk
            dist/SHA256SUMS.txt
            dist/SOURCE_COMMIT.txt
