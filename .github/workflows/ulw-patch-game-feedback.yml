'''
          if marker in text:
              text = text.replace(marker, insert, 1)
          vm.write_text(text)

          ui = Path('app/src/main/java/com/example/EnhancedSettingsScreen.kt')
          text = ui.read_text()
          old = '''    var haptics by remember { mutableStateOf(viewModel.settings.hapticsEnabled) }
    var diagnostics by remember { mutableStateOf(viewModel.uiSettings.diagnosticsEnabled) }
'''
          new = '''    var haptics by remember { mutableStateOf(viewModel.settings.hapticsEnabled) }
    var gameFeedback by remember { mutableStateOf(viewModel.uiSettings.gameFeedbackEnabled) }
    var gameFeedbackStrength by remember { mutableFloatStateOf(viewModel.uiSettings.gameFeedbackStrength) }
    var diagnostics by remember { mutableStateOf(viewModel.uiSettings.diagnosticsEnabled) }
'''
          if old in text:
              text = text.replace(old, new, 1)

          old = '''                        haptics = haptics,
                        onHaptics = {
                            haptics = it
                            viewModel.setHapticsEnabled(it)
                        },
                        diagnostics = diagnostics,
'''
          new = '''                        haptics = haptics,
                        onHaptics = {
                            haptics = it
                            viewModel.setHapticsEnabled(it)
                        },
                        gameFeedback = gameFeedback,
                        onGameFeedback = {
