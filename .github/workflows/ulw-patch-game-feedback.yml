        isConnected.value = false
'''
          if old in text:
              text = text.replace(old, new, 1)

          marker = '''    fun setHapticsEnabled(enabled: Boolean) {
        settings.hapticsEnabled = enabled
        haptics.enabled = enabled
        if (enabled) haptics.modeChange()
    }

'''
          insert = marker + '''    fun setGameFeedbackEnabled(enabled: Boolean) {
        uiSettings.gameFeedbackEnabled = enabled
        haptics.gameFeedbackEnabled = enabled
        if (!enabled) haptics.stopGameFeedback()
    }

    fun setGameFeedbackStrength(strength: Float) {
        val clamped = strength.coerceIn(0.25f, 1.5f)
