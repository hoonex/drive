name: Android Release

on:
  workflow_run:
    workflows:
      - Android Build
    types:
      - completed

permissions:
  contents: write

env:
  ANDROID_BUILD_TOOLS: "36.0.0"
  PREVIEW_SIGNING_CACHE_KEY: pcwheel-android-preview-signing-v2-Linux

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact validated source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Reject superseded release source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          if [[ "$SOURCE_SHA" != "$main_sha" ]]; then
            echo "::error::Validated source $SOURCE_SHA was superseded by main $main_sha; refusing stale release."
            exit 1
          fi
          echo "Release source is current main tip: $SOURCE_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install stable Android SDK 36
        shell: bash
        run: sdkmanager --install "platforms;android-36" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      # The preview key is only restored by this trusted post-validation workflow.
      # Validation builds and pull requests never read it.
      - name: Restore preview update signing key
        id: preview-key-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ${{ env.PREVIEW_SIGNING_CACHE_KEY }}

      - name: Ensure preview update signing identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -s "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=PC Wheel Preview,O=hoonex,C=KR" \
              -keyalg RSA \
              -keysize 3072 \
              -validity 10000 \
              -noprompt
            echo "Created new PC Wheel preview signing identity."
          else
            echo "Restored existing PC Wheel preview signing identity."
          fi

          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | head -n 1 \
            | tr -d '\r' \
            > "$RUNNER_TEMP/signing-cert-sha256.txt"
          test -s "$RUNNER_TEMP/signing-cert-sha256.txt"
          echo "Signing certificate SHA-256: $(cat "$RUNNER_TEMP/signing-cert-sha256.txt")"

      # Save immediately after generation. A later packaging/release failure must not
      # cause the signing identity to be regenerated on the next run.
      - name: Persist new preview update signing key
        if: steps.preview-key-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: ${{ env.PREVIEW_SIGNING_CACHE_KEY }}

      - name: Derive monotonic preview version
        shell: bash
        env:
          UPSTREAM_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          version_code=$((100000 + UPSTREAM_RUN_NUMBER))
          echo "PCWHEEL_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "PCWHEEL_VERSION_NAME=1.2.$UPSTREAM_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build preview APK from validated source
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Sign preview APK with stable identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out dist/PCWheel-android-preview.apk \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK signature and provenance
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha256sum dist/PCWheel-android-preview.apk | tee dist/SHA256SUMS.txt
          printf '%s\n' "$SOURCE_SHA" > dist/SOURCE_COMMIT.txt
          cp "$RUNNER_TEMP/signing-cert-sha256.txt" dist/SIGNING_CERT_SHA256.txt

          # apksigner's exit status is the authoritative signature verification result.
          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify \
            --verbose \
            --print-certs \
            dist/PCWheel-android-preview.apk \
            > "$RUNNER_TEMP/apksigner.txt"
          cat "$RUNNER_TEMP/apksigner.txt"

          apk_cert="$(
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" \
              | head -n 1 \
              | tr -d ':\r\n ' \
              | tr '[:lower:]' '[:upper:]'
          )"
          key_cert="$(
            tr -d ':\r\n ' < dist/SIGNING_CERT_SHA256.txt \
              | tr '[:lower:]' '[:upper:]'
          )"
          test -n "$apk_cert"
          test -n "$key_cert"
          test "$apk_cert" = "$key_cert"
          echo "Verified APK signing certificate SHA-256: $apk_cert"

      - name: Upload signed preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCWheel-android-preview-signed
          if-no-files-found: error
          path: |
            dist/PCWheel-android-preview.apk
            dist/SHA256SUMS.txt
            dist/SOURCE_COMMIT.txt
            dist/SIGNING_CERT_SHA256.txt

      - name: Publish stable preview URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          tag="android-preview"
          git tag -f "$tag" "$SOURCE_SHA"
          git push origin "refs/tags/$tag" --force

          apk_sha="$(cut -d' ' -f1 dist/SHA256SUMS.txt)"
          cert_sha="$(cat dist/SIGNING_CERT_SHA256.txt)"
          notes="Installable PC Wheel Android preview.\n\nSource commit: $SOURCE_SHA\nValidated Android Build run: $UPSTREAM_RUN_NUMBER\nAPK SHA-256: $apk_sha\nSigning certificate SHA-256: $cert_sha\n\nThe preview signing identity is isolated from pull-request builds. For public production distribution, use a dedicated release key in GitHub Secrets or Play App Signing."

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              dist/PCWheel-android-preview.apk \
              dist/SHA256SUMS.txt \
              dist/SOURCE_COMMIT.txt \
              dist/SIGNING_CERT_SHA256.txt \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "PC Wheel Android Preview" \
              --prerelease \
              --notes "$notes"
          else
            gh release create "$tag" \
              dist/PCWheel-android-preview.apk \
              dist/SHA256SUMS.txt \
              dist/SOURCE_COMMIT.txt \
              dist/SIGNING_CERT_SHA256.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "PC Wheel Android Preview" \
              --prerelease \
              --notes "$notes"
          fi
