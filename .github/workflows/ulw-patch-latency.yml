name: ULW latency patch

on:
  push:
    branches:
      - ulw/latency-200hz-20260902

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ulw/latency-200hz-20260902
          fetch-depth: 0
      - name: Apply exact latency patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/example/Core.kt')
          text = path.read_text()
          old = 'private const val FAST_PATH_MIN_NS = 6_000_000L'
          new = 'private const val FAST_PATH_MIN_NS = 5_000_000L'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('FAST_PATH_MIN_NS expected line not found')
          text = text.replace(
              '// Transport peaks around 166 Hz, so sampling above 200 Hz only adds wakeups/heat.',
              '// Transport fast-path is capped at 200 Hz, matching the motion sensor ceiling without redundant sends.',
              1,
          )
          path.write_text(text)
          PY
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/Core.kt
          git commit -m 'perf(android): align low-latency transport to 200Hz sensor ceiling'
          git push origin HEAD:ulw/latency-200hz-20260902
